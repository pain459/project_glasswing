
name: glasswing-portainer

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: glasswing-portainer
    restart: unless-stopped

    command:
      - --sslcert
      - /certs/portainer.crt
      - --sslkey
      - /certs/portainer.key

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./certs:/certs:ro

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: portainer

    networks:
      - proxy

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-portainer

volumes:
  portainer_data:
    name: glasswing-portainer-data

networks:
  proxy:
    name: glasswing-proxy
    external: true
