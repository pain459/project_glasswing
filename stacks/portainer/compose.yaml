
name: glasswing-portainer

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: glasswing-portainer
    restart: unless-stopped

    command:
      - --sslcert
      - /certs/portainer.crt
      - --sslkey
      - /certs/portainer.key

    ports:
      - "192.168.68.62:9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./certs:/certs:ro

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: portainer

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-portainer

    networks:
      - glasswing

volumes:
  portainer_data:
    name: glasswing-portainer-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
