
name: glasswing-portainer

services:
  portainer:
    extends:
      file: ../base.yaml
      service: hardened
    image: portainer/portainer-ce:lts
    container_name: glasswing-portainer

    command:
      - --sslcert
      - /certs/portainer.crt
      - --sslkey
      - /certs/portainer.key

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./certs:/certs:ro

    labels:
      com.glasswing.service: portainer

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-portainer

    networks:
      - glasswing

volumes:
  portainer_data:
    name: glasswing-portainer-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
