
name: glasswing-infisical

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: infisical
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    environment:
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

  infisical:
    image: infisical/infisical:0.167.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      DB_CONNECTION_URI: postgresql://infisical:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://redis:6379
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder
    networks: [internal]
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - infisical
    ports:
      - "${HOST_IP:?required}:8095:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    environment:
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder
    networks:
      internal:
      proxy:
        aliases:
          - infisical-gateway

networks:
  internal:
    driver: bridge
  proxy:
    name: glasswing-proxy
    external: true

volumes:
  postgres_data:
  redis_data:
