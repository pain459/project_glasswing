
receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s

    container_labels_to_metric_labels:
      com.docker.compose.project: compose_project
      com.docker.compose.service: compose_service

  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
      load: {}

  journald:
    include_units:
      - systemd-journald.service
    max_age: 12h

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 10s
    send_batch_size: 1000

  transform/host:
    log_statements:
      - context: log
        statements:
          - set(body("host.name"), "pathfinder")
          - set(body("deployment.environment"), "glasswing")

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /

  basicauth/openobserve:
    client_auth:
      username: ${env:ZO_ROOT_USER_EMAIL}
      password: ${env:ZO_ROOT_USER_PASSWORD}

exporters:
  otlphttp/openobserve:
    endpoint: http://192.168.68.62:3018/api/default
    auth:
      authenticator: basicauth/openobserve

  otlphttp/openobserve-logs:
    endpoint: http://192.168.68.62:3018/api/default/glasswing_host/_otlp
    auth:
      authenticator: basicauth/openobserve

service:
  extensions:
    - health_check
    - basicauth/openobserve

  pipelines:
    metrics:
      receivers:
        - docker_stats
        - otlp
        - hostmetrics
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/openobserve

    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/openobserve

    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/openobserve

    logs/host:
      receivers:
        - journald
      processors:
        - memory_limiter
        - transform/host
        - batch
      exporters:
        - otlphttp/openobserve-logs
