
name: glasswing-umami

services:
  umami:
    extends:
      file: ../base.yaml
      service: hardened
    image: umamisoftware/umami:3.4.1
    container_name: glasswing-umami

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3020:3000"

    environment:
      OTEL_SERVICE_NAME: glasswing-umami
      DATABASE_TYPE: postgresql
      DATABASE_URL: ${UMAMI_DATABASE_URL:?Required from Infisical}
      APP_SECRET: ${UMAMI_APP_SECRET:?Required from Infisical}
      DISABLE_TELEMETRY: "true"

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "http://127.0.0.1:3000/"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    mem_limit: 512m
    pids_limit: 128
    cpus: 0.5

    labels:
      com.glasswing.service: umami

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
