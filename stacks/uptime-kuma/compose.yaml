
name: glasswing-uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: glasswing-uptime-kuma
    restart: unless-stopped

    ports:
      - "192.168.68.62:3003:3001"

    volumes:
      - uptime_kuma_data:/app/data

    environment:
      TZ: Asia/Kolkata

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

volumes:
  uptime_kuma_data:
    name: glasswing-uptime-kuma-data
