
name: glasswing-uptime-kuma

services:
  uptime-kuma:
    extends:
      file: ../base.yaml
      service: hardened
    image: louislam/uptime-kuma:2
    container_name: glasswing-uptime-kuma

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3003:3001"

    volumes:
      - uptime_kuma_data:/app/data

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    labels:
      com.glasswing.service: uptime-kuma

    networks:
      - glasswing

volumes:
  uptime_kuma_data:
    name: glasswing-uptime-kuma-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
