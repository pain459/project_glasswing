
name: glasswing-open-notebook

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    restart: unless-stopped
    user: root

    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - ${SURREAL_PASSWORD:?Required from Infisical}
      - rocksdb:/mydata/mydatabase.db

    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - surreal_data:/mydata

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    restart: unless-stopped

    depends_on:
      - surrealdb

    ports:
      - "192.168.68.62:8502:8502"
      - "192.168.68.62:5055:5055"

    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Required from Infisical}
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?Required from Infisical}

      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: root
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Required from Infisical}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook

      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "2"
      TZ: Asia/Kolkata

    volumes:
      - notebook_data:/app/data

volumes:
  surreal_data:
    name: glasswing-notebook-surreal-data

  notebook_data:
    name: glasswing-notebook-data
