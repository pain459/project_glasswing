
name: glasswing-open-notebook

services:
  surrealdb:
    extends:
      file: ../base.yaml
      service: base
    image: surrealdb/surrealdb:v2
    user: root

    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - ${SURREAL_PASSWORD:?Required from Infisical}
      - rocksdb:/mydata/mydatabase.db

    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: ${SURREAL_EXPERIMENTAL_GRAPHQL:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-open-notebook

    volumes:
      - surreal_data:/mydata

    networks:
      - internal

  open_notebook:
    extends:
      file: ../base.yaml
      service: base
    image: lfnovo/open_notebook:v1-latest

    depends_on:
      - surrealdb

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:8502:8502"
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:5055:5055"

    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Required from Infisical}
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?Required from Infisical}

      SURREAL_URL: ${SURREAL_URL:?Required from Infisical}
      SURREAL_USER: ${SURREAL_USER:?Required from Infisical}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Required from Infisical}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:?Required from Infisical}
      SURREAL_DATABASE: ${SURREAL_DATABASE:?Required from Infisical}

      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:?Required from Infisical}
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-open-notebook

    volumes:
      - notebook_data:/app/data

    labels:
      com.glasswing.service: open-notebook

    networks:
      - internal
      - glasswing

volumes:
  surreal_data:
    name: glasswing-notebook-surreal-data

  notebook_data:
    name: glasswing-notebook-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
  internal:
    driver: bridge
