name: glasswing-sequential-thinking-mcp

services:
  sequential-thinking-mcp:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: .
      dockerfile: Dockerfile
    image: glasswing/sequential-thinking-mcp:0.7.0
    init: true

    ports:
      - "127.0.0.1:8004:8000"

    volumes:
      - sequential-thinking-data:/data

    environment:
      MCP_STORAGE_DIR: /data
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      OTEL_SERVICE_NAME: glasswing-sequential-thinking-mcp

    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

    labels:
      com.glasswing.service: sequential-thinking-mcp
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"

    networks:
      - glasswing

volumes:
  sequential-thinking-data:
    name: glasswing-sequential-thinking-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
