name: glasswing-opencode

services:
  init-permissions:
    image: alpine:3.20
    user: root
    command:
      - sh
      - -c
      - |
        mkdir -p \
          /home/opencode/.config \
          /home/opencode/.local/share \
          /home/opencode/.cache \
          /home/opencode/.local/state \
          /workspace
        chown -R 1000:1000 /home/opencode /workspace
    volumes:
      - /srv/glasswing/opencode/home:/home/opencode
      - /srv/glasswing/opencode/workspace:/workspace
    restart: "no"

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    image: glasswing/opencode:2.1.2
    container_name: glasswing-opencode
    restart: unless-stopped
    init: true

    depends_on:
      init-permissions:
        condition: service_completed_successfully
      open-notebook-mcp:
        condition: service_started
      steel-mcp:
        condition: service_started

    user: "1000:1000"
    working_dir: /workspace

    ports:
      - "192.168.68.62:3019:4096"

    environment:
      HOME: /home/opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Required from Infisical}
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      TZ: Asia/Kolkata

    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"

    volumes:
      - /srv/glasswing/opencode/home:/home/opencode
      - /srv/glasswing/opencode/workspace:/workspace
      - ./config:/etc/opencode:ro
      # Host access. The container runs as 1000:1000, which is the same uid and
      # gid as the host's `ravik`, so these paths stay read-write with no
      # ownership translation. Mounted at their real paths so absolute paths
      # from the host work unchanged. /home/ravik includes .ssh, so the agent
      # can clone and push over SSH.
      - /home/ravik:/home/ravik
      - /mnt/storage:/mnt/storage
      - /mnt/cold:/mnt/cold

    security_opt:
      - no-new-privileges:true

    pids_limit: 512
    mem_limit: 8g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.glasswing.service: opencode
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"

  open-notebook-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: glasswing/open-notebook-mcp:0.3.0
    container_name: glasswing-open-notebook-mcp
    restart: unless-stopped
    init: true

    environment:
      OPEN_NOTEBOOK_URL: http://192.168.68.62:5055
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?Required from Infisical}
      HOST: 0.0.0.0
      PORT: "8000"
      MCP_PATH: /mcp
      STATELESS_HTTP: "1"
      JSON_RESPONSE: "1"
      MCP_ALLOWED_HOSTS: open-notebook-mcp:8000,127.0.0.1:8000,localhost:8000
      TZ: Asia/Kolkata

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.glasswing.service: open-notebook-mcp
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"

  # Self-hosted Steel gives the model a real Chrome. steel-mcp speaks stdio only,
  # so supergateway fronts it with the streamable HTTP transport OpenCode uses.
  steel-mcp:
    build:
      context: ./steel-mcp
      dockerfile: Dockerfile
    image: glasswing/steel-mcp:3.0.0
    container_name: glasswing-steel-mcp
    restart: unless-stopped
    init: true

    environment:
      # Point the MCP server at the self-hosted Steel service, not steel.dev.
      STEEL_LOCAL: "true"
      STEEL_BASE_URL: http://192.168.68.62:3100
      STEEL_CONNECT_URL: ws://192.168.68.62:3100
      TZ: Asia/Kolkata

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.glasswing.service: steel-mcp
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"
