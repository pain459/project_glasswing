
name: glasswing-stirling-pdf

services:
  stirling-pdf:
    extends:
      file: ../base.yaml
      service: hardened
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.2.2
    container_name: glasswing-stirling-pdf

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3016:8080"

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      PUID: ${GLASSWING_PUID:?Required from Infisical}
      PGID: ${GLASSWING_PGID:?Required from Infisical}

      SECURITY_ENABLELOGIN: ${STIRLING_SECURITY_ENABLELOGIN:?Required from Infisical}
      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_ADMIN_USERNAME:?Required from Infisical}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_ADMIN_PASSWORD:?Required from Infisical}

      SYSTEM_DEFAULTLOCALE: ${STIRLING_SYSTEM_DEFAULTLOCALE:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-stirling-pdf

    volumes:
      - stirling_configs:/configs
      - stirling_logs:/logs
      - stirling_custom:/customFiles
      - stirling_pipeline:/pipeline
      - stirling_storage:/storage
      - stirling_tessdata:/usr/share/tessdata

    mem_limit: 4g

    labels:
      com.glasswing.service: stirling-pdf

    networks:
      - glasswing

volumes:
  stirling_configs:
    name: glasswing-stirling-configs
  stirling_logs:
    name: glasswing-stirling-logs
  stirling_custom:
    name: glasswing-stirling-custom
  stirling_pipeline:
    name: glasswing-stirling-pipeline
  stirling_storage:
    name: glasswing-stirling-storage
  stirling_tessdata:
    name: glasswing-stirling-tessdata

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
