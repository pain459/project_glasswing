
name: glasswing-postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: glasswing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      glasswing-backend:
        aliases:
          - glasswing-postgres

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ../../.local/secrets/postgres_password

volumes:
  postgres_data:
    name: glasswing-postgres-data

networks:
  glasswing-backend:
    external: true
    name: glasswing-backend
