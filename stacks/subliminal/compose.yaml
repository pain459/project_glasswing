
name: glasswing-subliminal

services:
  subliminal:
    image: ghcr.io/diaoul/subliminal:latest

    user: "1000:1000"

    volumes:
      - type: bind
        source: /mnt/cold/media
        target: /media
        read_only: false
        bind:
          create_host_path: false

    restart: "no"
