name: glasswing-subliminal

services:
  subliminal:
    image: ghcr.io/diaoul/subliminal:latest
    user: "1000:1000"
    restart: "no"

    environment:
      XDG_CACHE_HOME: /tmp/subliminal-cache
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - type: bind
        source: /mnt/cold/media
        target: /media
        read_only: false
        bind:
          create_host_path: false

    tmpfs:
      - /usr/src/cache:uid=1000,gid=1000,mode=0700