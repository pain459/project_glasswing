
name: glasswing-ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: glasswing-ollama
    restart: unless-stopped

    ports:
      - "192.168.68.62:11434:11434"

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MODELS: /root/.ollama

      # Inference baseline shared with the opencode stack.
      # Flash attention plus an 8-bit KV cache keeps more of the 131k context
      # on the 4090. One request and one loaded model prevent a second session
      # from splitting VRAM with the coding model.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

      # OpenTelemetry resource identity
      OTEL_SERVICE_NAME: glasswing-ollama
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - /mnt/storage/ollama:/root/.ollama

    gpus: all

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
