
name: glasswing-ollama

services:
  ollama:
    image: ollama/ollama:0.40.11
    container_name: glasswing-ollama
    restart: unless-stopped

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:11434:11434"

    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:?Required from Infisical}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:?Required from Infisical}
      OLLAMA_MODELS: ${OLLAMA_MODELS:?Required from Infisical}

      # Inference baseline shared with the opencode stack.
      # Flash attention plus an 8-bit KV cache keeps more of the 131k context
      # on the 4090. One request and one loaded model prevent a second session
      # from splitting VRAM with the coding model.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:?Required from Infisical}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:?Required from Infisical}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:?Required from Infisical}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-ollama

    volumes:
      - /mnt/storage/ollama:/root/.ollama

    gpus: all

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    labels:
      com.glasswing.service: ollama

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
