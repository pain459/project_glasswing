
name: glasswing-kavita

services:
  kavita:
    image: ghcr.io/kareadita/kavita:0.9.1.4
    container_name: glasswing-kavita
    restart: unless-stopped

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-kavita

    volumes:
      - kavita_config:/kavita/config

      - type: bind
        source: /mnt/cold/books
        target: /books
        read_only: true
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: kavita

    networks:
      - proxy

volumes:
  kavita_config:
    name: glasswing-kavita-config

networks:
  proxy:
    name: glasswing-proxy
    external: true
