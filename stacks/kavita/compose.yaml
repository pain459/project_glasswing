
name: glasswing-kavita

services:
  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: glasswing-kavita
    restart: unless-stopped

    ports:
      - "192.168.68.62:3017:5000"

    environment:
      TZ: Asia/Kolkata
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - kavita_config:/kavita/config

      - type: bind
        source: /mnt/cold/books
        target: /books
        read_only: true
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

volumes:
  kavita_config:
    name: glasswing-kavita-config
