
name: glasswing-kavita

services:
  kavita:
    extends:
      file: ../base.yaml
      service: hardened
    image: ghcr.io/kareadita/kavita:0.9.1
    container_name: glasswing-kavita

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3017:5000"

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-kavita

    volumes:
      - kavita_config:/kavita/config

      - type: bind
        source: /mnt/cold/books
        target: /books
        read_only: true
        bind:
          create_host_path: false

    labels:
      com.glasswing.service: kavita

    networks:
      - glasswing

volumes:
  kavita_config:
    name: glasswing-kavita-config

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
