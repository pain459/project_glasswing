# vLLM — LLM inference on the RTX 4090, replacing Ollama.
#
# Option C: One vLLM container per model. Only one is awake at a time.
# Sleeping containers keep weights in CPU RAM for fast switching (~2s).
#
# GPU arbitration: this stack and ComfyUI share the RTX 4090. Use
#   make gpu-comfyui   # sleep all vLLM, start ComfyUI
#   make gpu-vllm      # stop ComfyUI, wake the default vLLM
#   make gpu-status    # show who owns the GPU
#
# Model switching:
#   make vllm-model MODEL=qwen3.6       # switch to failback
#   make vllm-model MODEL=qwen3.8-opencode  # switch back
#   make vllm-model list                # list available models
#
# Storage: /mnt/storage/models/ (Safetensors weights from HuggingFace).
#
# To add a new model:
#   1. Download: HF_TOKEN=hf_... huggingface-cli download org/model \
#        --local-dir /mnt/storage/models/<name>
#   2. Add a service block below (copy an existing one, change model path)
#   3. make up STACK=vllm
#   4. make vllm-model MODEL=<name>

name: glasswing-vllm

services:
  # ── Primary: Qwen 3.8 27B ──────────────────────────────────────
  vllm-qwen38:
    extends:
      file: ../base.yaml
      service: base
    image: vllm/vllm-openai:latest
    container_name: glasswing-vllm-qwen38

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3043:8000"

    environment:
      OTEL_SERVICE_NAME: glasswing-vllm-qwen38
      # Required for /sleep and /wake_up endpoints.
      VLLM_SERVER_DEV_MODE: "1"

    volumes:
      - /mnt/storage/models:/models:ro

    gpus: all

    command:
      - "--model"
      - "/models/qwen3.8-27b-int4"
      - "--served-model-name"
      - "qwen3.8-opencode"
      - "--enable-sleep-mode"
      - "--gpu-memory-utilization"
      - "0.99"
      - "--max-model-len"
      - "32768"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "1"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    labels:
      com.glasswing.service: vllm
      com.glasswing.model: qwen3.8-opencode

    networks:
      - glasswing

  # ── Failback: Qwen 3.6 27B ─────────────────────────────────────
  # Started on demand. Not in the default `make up` path.
  # To start: docker compose --profile failback up -d
  vllm-qwen36:
    extends:
      file: ../base.yaml
      service: base
    image: vllm/vllm-openai:latest
    container_name: glasswing-vllm-qwen36
    profiles: ["failback"]

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3044:8000"

    environment:
      OTEL_SERVICE_NAME: glasswing-vllm-qwen36
      VLLM_SERVER_DEV_MODE: "1"

    volumes:
      - /mnt/storage/models:/models:ro

    gpus: all

    command:
      - "--model"
      - "/models/qwen3.6-27b-awq-int4"
      - "--served-model-name"
      - "qwen3.6"
      - "--enable-sleep-mode"
      - "--gpu-memory-utilization"
      - "0.99"
      - "--max-model-len"
      - "32768"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "1"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    labels:
      com.glasswing.service: vllm
      com.glasswing.model: qwen3.6

    networks:
      - glasswing

  # ── Lightweight: NVIDIA Nemotron Nano 9B v2 ────────────────────
  # Small, fast model for quick tasks. Hybrid Transformer-Mamba architecture.
  # Started on demand. Not in the default `make up` path.
  # To start: docker compose --profile lightweight up -d
  vllm-nemotron:
    extends:
      file: ../base.yaml
      service: base
    image: vllm/vllm-openai:latest
    container_name: glasswing-vllm-nemotron
    profiles: ["lightweight"]

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3045:8000"

    environment:
      OTEL_SERVICE_NAME: glasswing-vllm-nemotron
      VLLM_SERVER_DEV_MODE: "1"

    volumes:
      - /mnt/storage/models:/models:ro

    gpus: all

    command:
      - "--model"
      - "/models/nemotron-nano-9b-v2"
      - "--served-model-name"
      - "nemotron-nano"
      - "--trust-remote-code"
      - "--mamba_ssm_cache_dtype"
      - "float32"
      - "--enable-sleep-mode"
      - "--gpu-memory-utilization"
      - "0.99"
      - "--max-model-len"
      - "32768"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "1"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    labels:
      com.glasswing.service: vllm
      com.glasswing.model: nemotron-nano

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
