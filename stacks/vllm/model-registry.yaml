# vLLM model registry — the single source of truth for available models.
#
# switch-model.sh reads this file to know which container/service/profile to
# start and which port to probe. A "profile" is an alternative backend config
# for the same served model ID; entries sharing a port must never run together.
# Add a new model by:
#   1. Downloading weights to /mnt/storage/models/<name>
#   2. Adding a service block to compose.yaml (copy an existing one)
#   3. Adding an entry here (service name must match Compose exactly)
#   4. make vllm-model MODEL=<name>

models:
  qwen3.8-opencode:
    container: glasswing-vllm-qwen38
    service: vllm-qwen38
    profile: ""
    port: 3043
    description: "Qwen 3.8 27B — primary coding model, 131K k8v4"
    default: true

  qwen3.8-4bit:
    container: glasswing-vllm-qwen38-4bit
    service: vllm-qwen38-4bit
    profile: "alt-4bit"
    port: 3043
    description: "Qwen 3.8 27B — 4-bit KV profile, same model ID as primary"

  qwen3.6:
    container: glasswing-vllm-qwen36
    service: vllm-qwen36
    profile: "failback"
    port: 3044
    description: "Qwen 3.6 27B — failback, 131K k8v4"

  qwen3.6-4bit:
    container: glasswing-vllm-qwen36-4bit
    service: vllm-qwen36-4bit
    profile: "failback-4bit"
    port: 3044
    description: "Qwen 3.6 27B — 4-bit KV profile, same model ID as failback"

  nemotron-nano:
    container: glasswing-vllm-nemotron
    service: vllm-nemotron
    profile: "lightweight"
    port: 3045
    description: "NVIDIA Nemotron 3 Nano 4B FP8 — lightweight hybrid Mamba, ~5.3 GB"
