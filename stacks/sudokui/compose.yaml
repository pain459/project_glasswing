
name: glasswing-sudokui

services:
  sudokui:
    extends:
      file: ../base.yaml
      service: hardened
    image: glasswing/sudokui:1.0.0
    container_name: glasswing-sudokui

    ports:
      - "${GLASSWING_HOST_IP:?required}:3038:3000"

    environment:
      OTEL_SERVICE_NAME: glasswing-sudokui
      PORT: "3000"
      HOST: "0.0.0.0"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    labels:
      com.glasswing.service: sudokui

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
