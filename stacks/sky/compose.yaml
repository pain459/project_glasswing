
name: glasswing-sky

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment for all sky services
# ─────────────────────────────────────────────────────────────────────────────
x-sky-env: &sky-env
  TZ: ${GLASSWING_TZ:?Required from Infisical}
  SKY_EPHEMERIS_DATA_DIR: /app/data/ephemeris
  SKY_KERNEL_NAME: de440s

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── PostgreSQL for sky data persistence ──────────────────────────────────
  postgres:
    extends:
      file: ../base.yaml
      service: base
    image: postgres:17-alpine
    container_name: glasswing-sky-postgres

    environment:
      POSTGRES_USER: ${SKY_POSTGRES_USER:?Required from Infisical}
      POSTGRES_PASSWORD: ${SKY_POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${SKY_POSTGRES_DB:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-sky-postgres
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=glasswing,host.name=pathfinder

    volumes:
      - sky_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SKY_POSTGRES_USER:?Required} -d ${SKY_POSTGRES_DB:?Required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    pids_limit: 128
    mem_limit: 512m

    labels:
      com.glasswing.service: sky-postgres

    networks:
      - internal

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: .
      dockerfile: Dockerfile.api
    image: glasswing/sky-api:latest
    container_name: glasswing-sky-api

    environment:
      <<: *sky-env
      # Database connection
      DATABASE_URL: postgresql+psycopg://${SKY_POSTGRES_USER:?Required}:${SKY_POSTGRES_PASSWORD_URLENCODED:?Required}@glasswing-sky-postgres:5432/${SKY_POSTGRES_DB:?Required}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-sky-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:4318/v1/traces
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=glasswing,host.name=pathfinder

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # Persistent ephemeris data
      - sky_ephemeris_data:/app/data/ephemeris

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    mem_limit: 2g
    pids_limit: 256

    labels:
      com.glasswing.service: sky-api

    networks:
      - internal
      - glasswing

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  web:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: .
      dockerfile: Dockerfile.web
    image: glasswing/sky-web:latest
    container_name: glasswing-sky-web

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:5088:3000"

    environment:
      <<: *sky-env
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-sky-web

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    mem_limit: 512m

    labels:
      com.glasswing.service: sky-web

    networks:
      - internal
      - glasswing

  # ── Background Worker ────────────────────────────────────────────────────
  worker:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: glasswing/sky-worker:latest
    container_name: glasswing-sky-worker

    environment:
      <<: *sky-env
      DATABASE_URL: postgresql+psycopg://${SKY_POSTGRES_USER:?Required}:${SKY_POSTGRES_PASSWORD_URLENCODED:?Required}@glasswing-sky-postgres:5432/${SKY_POSTGRES_DB:?Required}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-sky-worker
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:4318/v1/traces
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=glasswing,host.name=pathfinder

    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

    volumes:
      - sky_ephemeris_data:/app/data/ephemeris

    mem_limit: 512m
    pids_limit: 128

    labels:
      com.glasswing.service: sky-worker

    networks:
      - internal

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  sky_postgres_data:
    name: glasswing-sky-postgres-data
  sky_ephemeris_data:
    name: glasswing-sky-ephemeris-data

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
