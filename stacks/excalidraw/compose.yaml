
name: glasswing-excalidraw

services:
  excalidraw:
    image: excalidraw/excalidraw:0.18.1
    container_name: glasswing-excalidraw
    restart: unless-stopped

    ports:
      - "192.168.68.62:3009:80"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    
    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-excalidraw

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: excalidraw
