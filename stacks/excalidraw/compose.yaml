
name: glasswing-excalidraw

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: glasswing-excalidraw
    restart: unless-stopped

    ports:
      - "192.168.68.62:3009:80"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    
    environment:
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    security_opt:
      - no-new-privileges:true
