
name: glasswing-forgejo-runner

services:
  runner:
    extends:
      file: ../base.yaml
      service: hardened
    image: alpine:3.20
    container_name: glasswing-forgejo-runner

    # Host mode: the runner binary runs with host PID/network and the Docker
    # socket mounted, giving it direct access to `docker compose` and the
    # local registry. This is what the release workflows need.
    pid: host
    network_mode: host

    environment:
      OTEL_SERVICE_NAME: glasswing-forgejo-runner
      TZ: ${GLASSWING_TZ:-UTC}

    volumes:
      # Docker socket — the runner executes docker compose / docker push.
      - /var/run/docker.sock:/var/run/docker.sock
      # Runner config (generated by pre-up.sh) and binary.
      - ./.runner-data:/opt/runner
      # The main Glasswing repo (read-only) for compose files and scripts.
      - ../..:/opt/glasswing:ro

    command: >
      sh -c '
        # Download the Forgejo Runner binary on first boot (idempotent).
        if [ ! -x /opt/runner/forgejo-runner ]; then
          echo "[INFO] Downloading forgejo-runner v13.2.1..."
          apk add --no-cache curl >/dev/null 2>&1
          curl -sSL -o /opt/runner/forgejo-runner \
            "https://code.forgejo.org/forgejo/runner/releases/download/v13.2.1/forgejo-runner-13.2.1-linux-amd64"
          chmod +x /opt/runner/forgejo-runner
        fi
        echo "[INFO] Starting forgejo-runner daemon..."
        exec /opt/runner/forgejo-runner daemon --config /opt/runner/runner-config.yml
      '

    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/runner/forgejo-runner || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    labels:
      com.glasswing.service: forgejo-runner
      com.glasswing.category: infrastructure
