
name: glasswing-dbgate

services:
  dbgate:
    image: dbgate/dbgate:7.3.2
    container_name: glasswing-dbgate
    restart: unless-stopped

    ports:
      - "192.168.68.62:3004:3000"

    environment:
      LOGIN: ${DBGATE_USERNAME:?Required from Infisical}
      PASSWORD: ${DBGATE_PASSWORD:?Required from Infisical}
      TZ: Asia/Kolkata
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - dbgate_data:/root/.dbgate

    security_opt:
      - no-new-privileges:true

volumes:
  dbgate_data:
    name: glasswing-dbgate-data
