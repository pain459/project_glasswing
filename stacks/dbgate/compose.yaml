
name: glasswing-dbgate

services:
  dbgate:
    extends:
      file: ../base.yaml
      service: hardened
    image: dbgate/dbgate:7.3.2
    container_name: glasswing-dbgate

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3004:3000"

    environment:
      LOGIN: ${DBGATE_USERNAME:?Required from Infisical}
      PASSWORD: ${DBGATE_PASSWORD:?Required from Infisical}
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-dbgate

    volumes:
      - dbgate_data:/root/.dbgate

    labels:
      com.glasswing.service: dbgate

    networks:
      - glasswing

volumes:
  dbgate_data:
    name: glasswing-dbgate-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
