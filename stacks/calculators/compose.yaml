
name: glasswing-calculators

services:
  calculators:
    build:
      context: .
      dockerfile: Dockerfile
    image: glasswing/calculators:latest
    container_name: glasswing-calculators
    restart: unless-stopped

    ports:
      - "192.168.68.62:3021:80"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-calculators

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: calculators
      com.glasswing.category: utilities
      com.glasswing.monitoring: "true"

    read_only: true

    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
