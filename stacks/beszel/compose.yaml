
name: glasswing-beszel

services:
  beszel:
    image: henrygd/beszel:0.21.1
    container_name: glasswing-beszel
    restart: unless-stopped

    environment:
      APP_URL: ${BESZEL_APP_URL:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-beszel

    ports:
      - "192.168.68.62:8090:8090"

    volumes:
      - beszel_data:/beszel_data

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  beszel_data:
    name: glasswing-beszel-data
