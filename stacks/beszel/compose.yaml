
name: glasswing-beszel

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: glasswing-beszel
    restart: unless-stopped

    environment:
      APP_URL: http://192.168.68.62:8090
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    ports:
      - "192.168.68.62:8090:8090"

    volumes:
      - beszel_data:/beszel_data

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  beszel_data:
    name: glasswing-beszel-data
