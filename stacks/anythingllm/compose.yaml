
name: glasswing-anythingllm

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: glasswing-anythingllm
    restart: unless-stopped

    ports:
      - "192.168.68.62:3012:3001"

    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${JWT_SECRET:?Required from Infisical}

      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://192.168.68.62:11434

      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://192.168.68.62:11434

      TZ: Asia/Kolkata
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - anythingllm_data:/app/server/storage

    # Required by the upstream Docker installation.
    cap_add:
      - SYS_ADMIN

volumes:
  anythingllm_data:
    name: glasswing-anythingllm-data
