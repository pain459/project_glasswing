
name: glasswing-anythingllm

services:
  anythingllm:
    extends:
      file: ../base.yaml
      service: base
    image: mintplexlabs/anythingllm:1.19
    container_name: glasswing-anythingllm

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3012:3001"

    environment:
      STORAGE_DIR: ${STORAGE_DIR:?Required from Infisical}
      JWT_SECRET: ${JWT_SECRET:?Required from Infisical}

      LLM_PROVIDER: ${LLM_PROVIDER:?Required from Infisical}
      OLLAMA_BASE_PATH: ${OLLAMA_BASE_PATH:?Required from Infisical}

      EMBEDDING_ENGINE: ${EMBEDDING_ENGINE:?Required from Infisical}
      EMBEDDING_BASE_PATH: ${EMBEDDING_BASE_PATH:?Required from Infisical}

      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-anythingllm

    volumes:
      - anythingllm_data:/app/server/storage

    # Required by the upstream Docker installation.
    cap_add:
      - SYS_ADMIN

    labels:
      com.glasswing.service: anythingllm

    networks:
      - glasswing

volumes:
  anythingllm_data:
    name: glasswing-anythingllm-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
