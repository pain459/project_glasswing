
name: glasswing-anythingllm

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: glasswing-anythingllm
    restart: unless-stopped

    ports:
      - "192.168.68.62:3012:3001"

    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${JWT_SECRET:?Required from Infisical}

      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://192.168.68.62:11434

      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://192.168.68.62:11434

      TZ: Asia/Kolkata

    volumes:
      - anythingllm_data:/app/server/storage

    # Required by the upstream Docker installation.
    cap_add:
      - SYS_ADMIN

volumes:
  anythingllm_data:
    name: glasswing-anythingllm-data
