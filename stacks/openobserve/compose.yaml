
name: glasswing-openobserve

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: glasswing-openobserve
    restart: unless-stopped

    ports:
      - "192.168.68.62:3018:5080"

    environment:
      TZ: Asia/Kolkata

      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Required from Infisical}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Required from Infisical}

      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - openobserve_data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  openobserve_data:
    name: glasswing-openobserve-data
