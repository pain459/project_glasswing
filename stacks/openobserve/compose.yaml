
name: glasswing-openobserve

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:1.1.2
    container_name: glasswing-openobserve
    restart: unless-stopped

    ports:
      - "192.168.68.62:3018:5080"

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}

      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Required from Infisical}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Required from Infisical}

      ZO_LOCAL_MODE: ${ZO_LOCAL_MODE:?Required from Infisical}
      ZO_DATA_DIR: ${ZO_DATA_DIR:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-openobserve

      ZO_COMPACT_ENABLED: ${ZO_COMPACT_ENABLED:?Required from Infisical}
      ZO_COMPACT_DATA_RETENTION_DAYS: ${ZO_COMPACT_DATA_RETENTION_DAYS:?Required from Infisical}

    volumes:
      - openobserve_data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  openobserve_data:
    name: glasswing-openobserve-data
