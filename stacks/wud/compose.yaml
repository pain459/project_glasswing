name: glasswing-wud

services:
  # --- Docker Socket Proxy: read-only Docker API access for WUD ---
  # Exposes only the subset of Docker API calls WUD needs (container/image
  # inspection, events, version info). WUD connects to it over TCP on the
  # internal glasswing network.
  docker-proxy:
    extends:
      file: ../base.yaml
      service: hardened
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: glasswing-docker-proxy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      # WUD only needs container/image inspection, events, and version info.
      CONTAINERS: "1"
      IMAGES: "1"
      EVENTS: "1"
      VERSION: "1"
      INFO: "1"
      PING: "1"

    # Expose only on the internal glasswing network, not to the host.
    expose:
      - "2375"

    labels:
      com.glasswing.service: docker-proxy
      # Exclude from WUD monitoring itself
      wud.watch: "false"

    networks:
      - glasswing

  # --- WUD: detection-only Docker image update intelligence ---
  wud:
    extends:
      file: ../base.yaml
      service: hardened
    image: ghcr.io/getwud/wud:9.7.0
    container_name: glasswing-wud

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3031:3000"

    volumes:
      # Persistent SQLite store for scan history and state
      - wud_store:/store
      # Host timezone for correct cron scheduling (Asia/Kolkata)
      - /etc/localtime:/etc/localtime:ro

    environment:
      # --- Server (binds 0.0.0.0 by default) ---
      WUD_SERVER_PORT: "3000"

      # --- Authentication (admin bootstrap, password from Infisical) ---
      WUD_AUTH_ADMIN_USER: "admin"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:?WUD dashboard password required}"

      # --- Watcher: connect to Docker via proxy (not direct socket) ---
      WUD_WATCHER_LOCAL_HOST: "docker-proxy"
      WUD_WATCHER_LOCAL_PORT: "2375"

      # Include only Docker Compose-managed containers
      WUD_WATCHER_LOCAL_INCLUDE: "label:^com\\.docker\\.compose"

      # Exclude WUD itself and the proxy from monitoring
      WUD_WATCHER_LOCAL_EXCLUDE: "^glasswing-wud|^glasswing-docker-proxy"

      # Scan schedule: 02:00 and 14:00 IST (container TZ = host TZ via /etc/localtime)
      WUD_WATCHER_LOCAL_CRON: "0 2,14 * * *"

      # Add jitter to distribute registry load (60s = default)
      WUD_WATCHER_LOCAL_JITTER: "60000"

      # Don't watch digest for Docker Hub mutable tags by default (rate limit safety).
      # Individual containers can override with wud.watch.digest=true label.
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "false"

      # Don't scan on startup (first scan happens at next cron window)
      WUD_WATCHER_LOCAL_WATCHATSTART: "false"

      # --- Detection only: no triggers configured ---
      # No auto-update triggers. No notification triggers. Pure intelligence gathering.

      # --- Timezone ---
      TZ: "${GLASSWING_TZ:?Required from Infisical}"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      com.glasswing.service: wud
      # Self-exclude from WUD monitoring
      wud.watch: "false"

    networks:
      - glasswing

volumes:
  wud_store:
    name: glasswing-wud-store

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
