name: glasswing-wiki

services:
  wiki:
    extends:
      file: ../base.yaml
      service: base
    build:
      context: .
      dockerfile: Dockerfile
    image: glasswing/wiki:latest
    container_name: glasswing-wiki

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3030:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      com.glasswing.service: wiki

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
