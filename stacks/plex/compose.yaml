
name: glasswing-plex

services:
  plex:
    image: plexinc/pms-docker:public
    container_name: glasswing-plex
    hostname: pathfinder
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: Asia/Kolkata
      PLEX_UID: "1000"
      PLEX_GID: "1000"
      ADVERTISE_IP: http://192.168.68.62:32400/

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    gpus: all

    volumes:
      - plex_config:/config
      - /mnt/cold/media:/media

    tmpfs:
      - /transcode:size=8g,mode=1777

    security_opt:
      - no-new-privileges:true

volumes:
  plex_config:
    name: glasswing-plex-config
