
name: glasswing-plex

services:
  plex:
    image: plexinc/pms-docker:public
    container_name: glasswing-plex
    hostname: pathfinder
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      PLEX_UID: ${PLEX_UID:?Required from Infisical}
      PLEX_GID: ${PLEX_GID:?Required from Infisical}
      ADVERTISE_IP: ${PLEX_ADVERTISE_IP:?Required from Infisical}

      NVIDIA_VISIBLE_DEVICES: ${PLEX_NVIDIA_VISIBLE_DEVICES:?Required from Infisical}
      NVIDIA_DRIVER_CAPABILITIES: ${PLEX_NVIDIA_DRIVER_CAPABILITIES:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-plex

    gpus: all

    volumes:
      - plex_config:/config
      - /mnt/cold/media:/media

    tmpfs:
      - /transcode:size=8g,mode=1777

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: plex

volumes:
  plex_config:
    name: glasswing-plex-config
