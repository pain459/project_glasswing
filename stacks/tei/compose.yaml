# TEI — Text Embeddings Inference (replaces Ollama for embeddings).
#
# CPU-based: zero GPU contention with vLLM/ComfyUI. Always running.
# Serves nomic-embed-text-v1.5 for Open Notebook and AnythingLLM.
#
# Port: 3046
# Model: nomic-ai/nomic-embed-text-v1.5 (from HuggingFace)
#
# Storage: /mnt/storage/models/tei/ (model weights)

name: glasswing-tei

services:
  tei:
    extends:
      file: ../base.yaml
      service: base
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: glasswing-tei

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3046:80"

    environment:
      OTEL_SERVICE_NAME: glasswing-tei

    volumes:
      - /mnt/storage/models/tei:/data

    # TEI expects the model at /data/model
    # The model is downloaded via huggingface-cli before first start.
    command: ["--model-id", "/data/model"]

    # The CPU image has no python/curl; probe /health with bash /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    labels:
      com.glasswing.service: tei
      com.glasswing.category: inference

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
