
name: glasswing-jupyterlab

services:
  jupyterlab:
    extends:
      file: ../base.yaml
      service: hardened
    image: quay.io/jupyter/scipy-notebook:2026-07-28
    container_name: glasswing-jupyterlab

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:8889:8888"

    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Required from Infisical}
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-jupyterlab

    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/jovyan/work

    volumes:
      - jupyterlab_data:/home/jovyan/work

    labels:
      com.glasswing.service: jupyterlab

    networks:
      - glasswing

volumes:
  jupyterlab_data:
    name: glasswing-jupyterlab-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
