
name: glasswing-steel

services:
  steel:
    extends:
      file: ../base.yaml
      service: hardened
    # No versioned tags available; :latest is the only option
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: glasswing-steel
    init: true

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:${STEEL_PORT:?Missing STEEL_PORT}:3000"
      # CDP debugger port – needed for Chrome DevTools Protocol debugging
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:9223:9223"

    environment:
      NODE_ENV: ${STEEL_NODE_ENV:?Required from Infisical}
      LOG_STORAGE_ENABLED: ${STEEL_LOG_STORAGE_ENABLED:?Required from Infisical}
      LOG_STORAGE_PATH: ${STEEL_LOG_STORAGE_PATH:?Required from Infisical}
      # Enable the Commands API so the MCP server can drive the browser
      # (navigate, snapshot, click, type, etc.). Off by default.
      ENABLE_COMMANDS_API: "true"
      TZ: ${GLASSWING_TZ:?Required from Infisical}

    volumes:
      - /srv/glasswing/steel/cache:/app/.cache
      - /srv/glasswing/steel/logs:/data/logs
      - /srv/glasswing/steel/exports:/tmp/steel-browser-exports

    shm_size: "1gb"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.glasswing.service: steel
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
