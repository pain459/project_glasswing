# Glasswing reverse proxy — one HTTPS entry point for every web UI.
#
# Routing is host-based: <service>.glasswing.lan -> container on the shared
# `glasswing-proxy` network. Path-based routing is deliberately avoided because
# several SPAs (Excalidraw, CyberChef, IT-Tools, Calculators) assume they own /.
#
# Ports that remain direct (not proxied):
#   53/tcp+udp   AdGuard DNS
#   2222/tcp     Forgejo SSH
#   3014/tcp     Dagu (host networking)
#   3018/tcp     OpenObserve ingestion (OTel + Vector)
#   3100/tcp     Steel API/CDP
#   11434/tcp    Ollama API (used by host-side tooling and local clients)
#   32400/tcp    Plex (host networking)
#   4318/tcp     OTLP HTTP ingestion
#   5432/tcp     PostgreSQL
#   8095/tcp     Infisical gateway (bootstrap; `make` depends on it)
#   9223/tcp     Steel CDP debugger

# ---------------------------------------------------------------------------
# HTTP: health check and redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # Used by the container healthcheck; must stay on plain HTTP.
    location = /_health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS default: reject unknown hostnames
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name _;

    include /etc/nginx/snippets/tls.conf;

    return 444;
}

# ---------------------------------------------------------------------------
# Dashboard (root of the platform)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name glasswing.lan homepage.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/proxy.conf;

    location / {
        set $upstream http://glasswing-homepage:3000;
        proxy_pass $upstream;
    }
}

# ---------------------------------------------------------------------------
# Core infrastructure
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name infisical.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/proxy.conf;

    # The Infisical stack keeps its own nginx gateway and TLS certificate.
    # Proxying to it preserves the existing bootstrap path on :8095.
    location / {
        set $upstream https://infisical-gateway:443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portainer.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Portainer serves HTTPS on 9443 with its own self-signed certificate.
    location / {
        set $upstream https://glasswing-portainer:9443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
}

