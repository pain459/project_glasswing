    location / {
        set $upstream http://glasswing-vector:8686;
        proxy_pass $upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dagu.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Dagu uses host networking so its coordinator advertises a reachable IP.
    # The upstream is written literally (not via $upstream) so nginx resolves
    # it from /etc/hosts at startup: `host.docker.internal` comes from
    # `extra_hosts`, and the embedded Docker DNS does not always answer for
    # hosts-file entries. The name always resolves, so nginx still starts
    # before Dagu does.
    location / {
        proxy_pass http://host.docker.internal:3014;
    }
}

