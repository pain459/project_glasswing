    http2 on;
    server_name otel.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Only the collector health endpoint is exposed. OTLP ingestion stays on
    # :4318 because every stack sends there directly.
    location / {
        set $upstream http://glasswing-otel-collector:13133;
        proxy_pass $upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vector.glasswing.lan;

    include /etc/nginx/snippets/tls.conf;
