name: glasswing-proxy

services:
  proxy:
    # Optional second entry point for every Glasswing web UI.
    #
    # Plain IP:port access is the default: each stack publishes its own host
    # port, and the platform works without DNS or this proxy. The proxy adds a
    # hostname route (https://<service>.glasswing.lan) for clients that can
    # resolve *.glasswing.lan and trust the Glasswing CA.
    #
    # Non-HTTP protocols and fixed client endpoints (DNS, SSH, Plex,
    # PostgreSQL, OTLP, the Ollama API used by host tooling, Steel API/CDP)
    # are only reachable by IP:port by design.
    image: nginx:1.29.8-alpine
    container_name: glasswing-proxy
    restart: unless-stopped

    ports:
      - "${GLASSWING_HOST_IP:?Required from Infisical}:80:80"
      - "${GLASSWING_HOST_IP:?Required from Infisical}:443:443"

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-proxy

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Generated by scripts/gen-proxy-cert.sh (git-ignored).
      - ./certs:/etc/nginx/certs:ro

    # Dagu and Plex use host networking, so the proxy reaches them through the
    # host gateway rather than the shared Docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - proxy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/_health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: proxy

networks:
  proxy:
    name: glasswing-proxy
    external: true
