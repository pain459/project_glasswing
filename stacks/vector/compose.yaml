
name: glasswing-vector

services:
  vector:
    extends:
      file: ../base.yaml
      service: hardened
    image: timberio/vector:0.60.0-debian
    container_name: glasswing-vector

    command:
      - --config
      - /etc/vector/vector.yaml

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      DOCKER_HOST: ${VECTOR_DOCKER_HOST:?Required from Infisical}
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Required from Infisical}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Required from Infisical}

      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: ${VECTOR_ALLOW_ENV_INTERPOLATION:?Required from Infisical}

    group_add:
      - "${DOCKER_GID:?Docker socket GID required}"

    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:8686:8686"

    mem_limit: 512m

    labels:
      com.glasswing.service: vector

    networks:
      - glasswing

volumes:
  vector_data:
    name: glasswing-vector-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
