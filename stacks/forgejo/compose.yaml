
name: glasswing-forgejo

services:
  forgejo:
    extends:
      file: ../base.yaml
      service: hardened
    image: codeberg.org/forgejo/forgejo:17
    container_name: glasswing-forgejo

    environment:
      USER_UID: ${FORGEJO_USER_UID:?Required from Infisical}
      USER_GID: ${FORGEJO_USER_GID:?Required from Infisical}

      FORGEJO__server__DOMAIN: ${FORGEJO_SERVER_DOMAIN:?Required from Infisical}
      FORGEJO__server__ROOT_URL: ${FORGEJO_SERVER_ROOT_URL:?Required from Infisical}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SERVER_SSH_DOMAIN:?Required from Infisical}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SERVER_SSH_PORT:?Required from Infisical}

      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_SERVICE_DISABLE_REGISTRATION:?Required from Infisical}
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: ${FORGEJO_SERVICE_REQUIRE_SIGNIN_VIEW:?Required from Infisical}

      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-forgejo

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3011:3000"
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:2222:22"

    volumes:
      - forgejo_data:/data
      - /etc/localtime:/etc/localtime:ro

    labels:
      com.glasswing.service: forgejo

    networks:
      - glasswing

volumes:
  forgejo_data:
    name: glasswing-forgejo-data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
