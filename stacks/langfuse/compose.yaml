
name: glasswing-langfuse

x-langfuse-env: &langfuse-env
  HOSTNAME: ${LANGFUSE_HOSTNAME:?Required from Infisical}
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:?Required from Infisical}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Required}@postgres:5432/langfuse

  SALT: ${LANGFUSE_SALT:?Required}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Required}

  CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?Required from Infisical}
  CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?Required from Infisical}
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?Required from Infisical}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Required}
  CLICKHOUSE_CLUSTER_ENABLED: ${LANGFUSE_CLICKHOUSE_CLUSTER_ENABLED:?Required from Infisical}

  REDIS_HOST: ${LANGFUSE_REDIS_HOST:?Required from Infisical}
  REDIS_PORT: ${LANGFUSE_REDIS_PORT:?Required from Infisical}
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Required}

  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:?Required from Infisical}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:?Required from Infisical}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:?Required from Infisical}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Required}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:?Required from Infisical}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:?Required from Infisical}

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:?Required from Infisical}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:?Required from Infisical}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID:?Required from Infisical}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Required}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:?Required from Infisical}
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT:?Required from Infisical}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:?Required from Infisical}

  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:?Required from Infisical}

x-langfuse-depends: &langfuse-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?Required from Infisical}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?Required from Infisical}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?Required}

    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction'

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"

    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:?Required from Infisical}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?Required from Infisical}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Required}

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://127.0.0.1:8123/ping'
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:0.20261023
    restart: unless-stopped

    entrypoint: sh
    command:
      - -c
      - 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data'

    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:?Required from Infisical}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Required}

    ports:
      - "192.168.68.62:9090:9000"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped

    depends_on: *langfuse-depends

    environment:
      <<: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped

    depends_on: *langfuse-depends

    ports:
      - "192.168.68.62:3010:3000"

    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Required}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-langfuse

    labels:
      com.glasswing.service: langfuse

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
