# Situation Brief
#
# Runs the Glasswing situation brief every 6 hours: gathers a snapshot of
# the platform, reasons over it with the local vLLM model, and pushes a
# plain-English brief to Telegram.
#
# How it works:
#   1. Builds the situation image (if not already built).
#   2. Runs the brief container with secrets injected from Infisical.
#   3. The brief gathers signals, generates a summary, and delivers to Telegram.
#
# On-demand: `make situation` (see Makefile).
#
# The actual work is done by the situation container (stacks/situation/).
# Dagu provides the schedule and the Docker socket for building.

name: situation-brief
description: "Generate and deliver a plain-English situation brief to Telegram"

schedule:
  - "0 */6 * * *"        # Every 6 hours
overlap_policy: skip     # Skip if previous run is still active

steps:
  # Build the situation image (idempotent — skips if already built)
  - id: build
    run: |
      cd /home/ravik/src_git/project_glasswing
      docker build -q -t glasswing/situation:latest stacks/situation/ 2>/dev/null || true
    timeout_sec: 120

  # Run the brief with secrets injected from Infisical
  - id: run_brief
    run: |
      cd /home/ravik/src_git/project_glasswing
      # Single-quoted bash -c defers $VAR expansion until after with-infisical.sh
      # has exported the secrets. Expanding in the outer shell would pass empties.
      ./scripts/with-infisical.sh /situation stacks/situation/secrets.list -- \
        bash -c 'docker run --rm \
          --network glasswing \
          --memory 256m \
          --pids-limit 64 \
          -v /var/run/docker.sock:/var/run/docker.sock:ro \
          -e TELEGRAM_BOT_TOKEN \
          -e TELEGRAM_CHAT_ID \
          -e LITELLM_MASTER_KEY \
          -e KUMA_API_TOKEN \
          -e BESZEL_API_KEY \
          -e PAPERLESS_API_TOKEN \
          -e OPENOBSERVE_EMAIL="$ZO_ROOT_USER_EMAIL" \
          -e OPENOBSERVE_PASSWORD="$ZO_ROOT_USER_PASSWORD" \
          -e TZ="$GLASSWING_TZ" \
          -e VLLM_URL="http://glasswing-vllm-qwen38:8000" \
          -e VLLM_MODEL="qwen3.8-opencode" \
          -e KUMA_URL="http://glasswing-uptime-kuma:3001" \
          -e BESZEL_URL="http://glasswing-beszel:8090" \
          -e OPENOBSERVE_URL="http://glasswing-openobserve:5080" \
          -e LITELLM_URL="http://glasswing-litellm:4000" \
          -e PAPERLESS_URL="http://glasswing-paperless:8000" \
          glasswing/situation:latest'
    timeout_sec: 300    # 5 minutes max (inference + delivery)
