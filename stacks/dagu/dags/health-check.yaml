# System health check workflow
#
# Runs periodic health checks on Glasswing services.

name: health-check
description: "Run system health checks and log results"

schedule:
  - "0 */6 * * *"          # Every 6 hours
overlap_policy: skip       # Skip if previous run is still active

steps:
  # 1. Disk usage report
  - id: disk_usage
    run: |
      echo "=== Disk Usage Report ==="
      df -h / /tmp 2>/dev/null || true
      echo ""
      echo "=== Top 5 Largest Directories ==="
      du -sh /var/log/* 2>/dev/null | sort -rh | head -5 || true

  # 2. Ping OpenObserve health endpoint
  - id: api_ping
    action: http.request
    with:
      method: GET
      url: http://192.168.68.62:3018/healthz
      timeout_sec: 10
    continue_on:
      failure: true                         # Don't fail the whole DAG
