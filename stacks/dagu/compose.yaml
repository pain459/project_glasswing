 
name: glasswing-dagu

services:
  dagu:
    # Dagu is a self-hosted workflow orchestrator: schedule cron jobs, run
    # scripts, trigger APIs, and review outputs via a built-in Web UI.
    # Single binary, file-backed state, no external database required.
    image: ghcr.io/dagucloud/dagu:2.24.0
    container_name: glasswing-dagu
    restart: unless-stopped
    init: true

    # Host networking so DAGs can reach other services on localhost
    # (e.g. OpenObserve :3018, Ollama :11434) and the coordinator
    # doesn't advertise an unreachable container IP.
    network_mode: host

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      DAGU_TZ: ${GLASSWING_TZ:?Required from Infisical}

      # Dagu Web UI port (internal, bound directly on host with network_mode: host)
      DAGU_PORT: "3014"

      # DAG discovery directory
      DAGU_DAGS_DIR: "/var/lib/dagu/dags"

      # Wiki pages live under data_dir (writable) rather than dags_dir
      # which is overlaid with read-only bind mounts.
      DAGU_WIKI_DIR: "/var/lib/dagu/data/wiki"

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-dagu

    volumes:
      # Persistent run history, logs, settings, and DAG definitions
      - dagu_data:/var/lib/dagu
      # Version-controlled DAG definitions mounted under the dags directory.
      # Dagu also writes wiki/ and runtime files here, so the named volume
      # provides the base and this bind mount overlays our DAG files.
      - ./dags/health-check.yaml:/var/lib/dagu/dags/health-check.yaml:ro
      - ./dags/staged-image-update.yaml:/var/lib/dagu/dags/staged-image-update.yaml:ro
      # Docker socket for DAGs that manage containers (e.g. staged-image-update)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Project directory so DAGs can read compose files and run docker compose
      - /home/ravik/src_git/project_glasswing:/home/ravik/src_git/project_glasswing:ro

    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3014/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    pids_limit: 256
    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    labels:
      com.glasswing.service: dagu

volumes:
  dagu_data:
    name: glasswing-dagu-data
