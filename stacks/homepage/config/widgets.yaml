---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- glances:
    url: http://glasswing-glances:61208
    version: 4
    cpu: true
    memory: true
    uptime: true
    network: true

- datetime:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss

- openmeteo:
    label: New Delhi
    latitude: 28.6139
    longitude: 77.209
    timezone: Asia/Kolkata
    units: metric
    cache: 10

- search:
    provider: duckduckgo
    target: _blank
