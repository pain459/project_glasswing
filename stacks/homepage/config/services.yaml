# Glasswing — Homepage services.yaml
#
# Cards link to plain IP:port URLs, so no client-side DNS is required.
# Widgets and site monitors use container names on the shared Docker network,
# so they work even if the host IP changes. Where the service speaks HTTPS only
# (Portainer, the Infisical gateway) the monitor uses HTTPS on the internal
# name; Homepage's HTTP client does not verify upstream certificates.

- System Monitoring:
    - CPU Usage:
        icon: mdi-speedometer
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: cpu

    - Memory Usage:
        icon: mdi-memory
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: memory

    - Top Processes:
        icon: mdi-sitemap
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: process

