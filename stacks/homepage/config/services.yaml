# Glasswing — Homepage services.yaml
#
# Public URLs use the reverse proxy (*.glasswing.lan).
# Widgets and site monitors use container names on the shared Docker network
# instead of the public hostnames, so the dashboard keeps working even when
# AdGuard or the proxy is down. Where the service speaks HTTPS only
# (Portainer, the Infisical gateway) the monitor uses HTTPS on the internal
# name; Homepage's HTTP client does not verify upstream certificates.

- System Monitoring:
    - CPU Usage:
        icon: mdi-speedometer
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: cpu

    - Memory Usage:
        icon: mdi-memory
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: memory

    - Top Processes:
        icon: mdi-sitemap
        widget:
            type: glances
            url: http://glasswing-glances:61208
            version: 4
            metric: process

