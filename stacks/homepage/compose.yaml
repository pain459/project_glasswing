
name: glasswing-homepage

services:
  homepage:
    extends:
      file: ../base.yaml
      service: hardened
    image: ghcr.io/gethomepage/homepage:v2.7.0

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3006:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Required from Infisical}
      PUID: ${GLASSWING_PUID:?Required from Infisical}
      PGID: ${GLASSWING_PGID:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-homepage

    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons:ro

    # Resolve host for Glances API access
    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      com.glasswing.service: homepage

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
