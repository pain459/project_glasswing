name: glasswing-homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: glasswing-homepage
    restart: unless-stopped

    ports:
      - "192.168.68.62:3006:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.68.62:3006,localhost:3006"
      PUID: "1000"
      PGID: "1000"

      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons:ro

    security_opt:
      - no-new-privileges:true
