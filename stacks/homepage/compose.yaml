
name: glasswing-homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: glasswing-homepage
    restart: unless-stopped

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Required from Infisical}
      PUID: ${GLASSWING_PUID:?Required from Infisical}
      PGID: ${GLASSWING_PGID:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-homepage

    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons:ro

    # Reach host-network services (Dagu, Plex) for site monitors.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: homepage

    networks:
      - proxy

networks:
  proxy:
    name: glasswing-proxy
    external: true
