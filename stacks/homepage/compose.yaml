
name: glasswing-homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:2.7.0
    restart: unless-stopped

    ports:
      - "192.168.68.62:3006:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Required from Infisical}
      PUID: ${GLASSWING_PUID:?Required from Infisical}
      PGID: ${GLASSWING_PGID:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-homepage

    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons:ro

    security_opt:
      - no-new-privileges:true
