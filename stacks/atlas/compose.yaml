name: glasswing-atlas

# ATLAS — Open planetary disaster intelligence
#
# Architecture:
#   web     → published on :5090 (LAN web UI), joins glasswing
#   engine  → internal only (FastAPI + DuckDB), joins internal
#
# The web container serves the React/Cesium frontend and reverse-proxies
# /api/ requests to the engine container. Both communicate over the
# internal Docker network.

services:
  engine:
    extends:
      file: ../base.yaml
      service: base
    build:
      context: ./src
      dockerfile: ../Dockerfile.engine
    image: glasswing/atlas-engine:0.3.0
    container_name: glasswing-atlas-engine

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: 8787
      ATLAS_DATA_DIR: /data/runtime
      ATLAS_CORS_ORIGINS: '["*"]'
      # Ollama AI disabled by default (requires loopback; see docs)
      # ATLAS_AI_BASE_URL: http://glasswing-ollama:11434
      # ATLAS_AI_MODEL: llama3.1:8b
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-atlas-engine

    volumes:
      - atlas-data:/data

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    mem_limit: 4g
    pids_limit: 512

    networks:
      - internal

  web:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: ./src
      dockerfile: ../Dockerfile.web
    image: glasswing/atlas-web:0.3.0
    container_name: glasswing-atlas-web

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:5090:80"

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-atlas-web

    depends_on:
      engine:
        condition: service_healthy

    labels:
      com.glasswing.service: atlas
      com.glasswing.category: research
      com.glasswing.monitoring: "true"

    networks:
      - internal
      - glasswing

volumes:
  atlas-data:
    name: glasswing-atlas-data

networks:
  internal:
    driver: bridge
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
