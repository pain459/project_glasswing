
name: glasswing-glances

services:
  glances:
    # Glances monitors the host. The -full variant includes psutil extras
    # for disk I/O, sensors, and container stats.
    image: nicolargo/glances:ubuntu-4.5.8-full
    container_name: glasswing-glances
    restart: unless-stopped
    init: true

    environment:
      GLANCES_OPT: "-w"
      TZ: ${GLASSWING_TZ:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-glances

    ports:
      - "127.0.0.1:61208:61208"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro

    pid: host

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    labels:
      com.glasswing.service: glances
