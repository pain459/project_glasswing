
name: glasswing-glances

services:
  glances:
    extends:
      file: ../base.yaml
      service: hardened
    # Glances monitors the host. The -full variant includes psutil extras
    # for disk I/O, sensors, and container stats.
    image: nicolargo/glances:ubuntu-4.5.8-full
    container_name: glasswing-glances
    init: true

    environment:
      GLANCES_OPT: "-w"
      TZ: ${GLASSWING_TZ:?Required from Infisical}

      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-glances

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:61208:61208"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro

    pid: host

    pids_limit: 256
    mem_limit: 512m

    labels:
      com.glasswing.service: glances

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
