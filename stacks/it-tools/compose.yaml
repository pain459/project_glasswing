
name: glasswing-it-tools

services:
  it-tools:
    image: ghcr.io/corentinth/it-tools:2024.10.22-7ca5933
    container_name: glasswing-it-tools
    restart: unless-stopped

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-it-tools

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: it-tools

    read_only: true

    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    ports:
      # Direct IP access: reachable without DNS.
      - "192.168.68.62:3015:80"

    networks:
      - proxy

networks:
  proxy:
    name: glasswing-proxy
    external: true
