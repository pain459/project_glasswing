
name: glasswing-it-tools

services:
  it-tools:
    extends:
      file: ../base.yaml
      service: hardened
    image: ghcr.io/corentinth/it-tools:2024.10.22-7ca5933
    container_name: glasswing-it-tools

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3015:80"

    labels:
      com.glasswing.service: it-tools
    
    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-it-tools

    read_only: true

    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
