events { worker_connections 64; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No caching for JS/CSS so updates take effect immediately
    location ~* \.(js|css)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # Serve ICS feed files with correct content type and no cache
    # (feeds are regenerated monthly; stale cache = wrong panchangam)
    location ~* \.ics$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Content-Type "text/calendar; charset=utf-8";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
