# LiteLLM Proxy Configuration — Glasswing
#
# Purpose: Route OpenCode's Ollama models through LiteLLM for unified
# cost and token tracking. Spend logs are stored in the shared Postgres
# database (litellm DB) and viewable in the Admin UI at /ui.
#
# Models are registered with electricity-based pricing (measured on
# Pathfinder: RTX 4090, ₹9/kWh confirmed by tariff) so the Admin UI shows
# real cost. Full derivation and the price ladder:
# docs/electricity-token-pricing.md (2026-11-10 wall-meter calibration).
#
# Pricing model (calibrated 2026-11-10 from wall meter + LiteLLM ledger):
#   Equipment baseline: 61 W (other equipment on same plug, constant, excluded)
#   Server idle:        200 W (models loaded, no active inference)
#   Server AI bursts:   640 W (wall 600-795 W - 61 W equipment)
#   Energy split:       prefill 14.8% / generation 85.2% (time × power)
#   Cache hit rate:     98.1% (475M cached / 484M prompt tokens, Nov 6-10)
#   Full-cost:          input ₹5.42/MTok ($0.0571), output ₹25.21/MTok ($0.2656)
#                       at ₹94.91/USD. USD is display-only; ₹ is the primary basis.
#   llama3.1 still uses the 2026-10-30 basis (re-audit pending; loading it
#   would evict the 27B model with only ~1.8 GB headroom).

# To add a new model, append to model_list. The model_name is what
# OpenCode (or any client) uses in the API request.

model_list:
  # ── Primary coding model ─────────────────────────────────────
  # Serve qwen3.8-opencode with:
  #   OLLAMA_KV_CACHE_TYPE=q4_0, OLLAMA_MAX_LOADED_MODELS=2, num_ctx 131072
  # which keeps all 66 layers on the GPU and leaves the embedding model
  # resident beside it. See stacks/ollama/README.md.
  - model_name: qwen3.8-opencode
    litellm_params:
      model: openai/qwen3.8-opencode
      api_base: http://glasswing-ollama:11434/v1
      api_key: ollama
      # Electricity-based pricing, 2026-11-10 wall-meter calibration (₹9/kWh).
      # Server idle 200W, AI bursts 640W, 98.1% cache hit rate.
      # Input: $0.0571/MTok, Output: $0.2656/MTok
      # Cached input (KV prefix reuse) is charged 0: Ollama reports
      # prompt_tokens_details.cached_tokens and those tokens are never
      # re-prefilled. Verified 2026-11-10: 475M/484M tokens cached (98.1%).
      input_cost_per_token: 0.0000000571
      output_cost_per_token: 0.0000002656
      cache_read_input_token_cost: 0

  # ── Failback coding model ────────────────────────────────────
  # Must be the *tuned* qwen3.6-opencode alias, not the qwen3.6:27b base
  # model: the base carries a small default context and default thinking, so
  # a failover to it would silently lose most of the window. Build it with
  # `make ollama-failback`. Same budget and temperature as the primary.
  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6-opencode:latest
      api_base: http://glasswing-ollama:11434/v1
      api_key: ollama
      # Same rates as primary; cached input priced 0 (see primary entry).
      input_cost_per_token: 0.0000000571
      output_cost_per_token: 0.0000002656
      cache_read_input_token_cost: 0

  # ── Llama 3.1 8B (lightweight) ───────────────────────────────
  - model_name: llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://glasswing-ollama:11434/v1
      api_key: ollama
      input_cost_per_token: 0.0000000434
      output_cost_per_token: 0.0000001104

litellm_settings:
  # Drop unsupported params instead of failing
  drop_params: true
  request_timeout: 300
  num_retries: 2
