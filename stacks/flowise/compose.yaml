
name: glasswing-flowise

services:
  flowise:
    image: flowiseai/flowise:3.1.3
    container_name: glasswing-flowise
    restart: unless-stopped

    ports:
      - "192.168.68.62:3002:3000"

    environment:
      PORT: ${FLOWISE_PORT:?Required from Infisical}
      APP_URL: ${FLOWISE_APP_URL:?Required from Infisical}

      DATABASE_TYPE: ${FLOWISE_DATABASE_TYPE:?Required from Infisical}
      DATABASE_PATH: ${FLOWISE_DATABASE_PATH:?Required from Infisical}

      SECRETKEY_PATH: ${FLOWISE_SECRETKEY_PATH:?Required from Infisical}
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY_OVERWRITE:?Required from Infisical}

      JWT_AUTH_TOKEN_SECRET: ${JWT_AUTH_TOKEN_SECRET:?Required from Infisical}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?Required from Infisical}

      LOG_PATH: ${FLOWISE_LOG_PATH:?Required from Infisical}
      BLOB_STORAGE_PATH: ${FLOWISE_BLOB_STORAGE_PATH:?Required from Infisical}

      DISABLE_FLOWISE_TELEMETRY: ${FLOWISE_DISABLE_TELEMETRY:?Required from Infisical}
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-flowise

    volumes:
      - flowise_data:/home/node/.flowise

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: flowise
    
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  init-permissions:
    image: alpine:3.20
    user: root
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - flowise_data:/data
    restart: "no"

volumes:
  flowise_data:
    name: glasswing-flowise-data
