
name: glasswing-adguard

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: glasswing-adguard
    restart: unless-stopped

    ports:
      - "192.168.68.62:53:53/tcp"
      - "192.168.68.62:53:53/udp"
      - "192.168.68.62:3007:80/tcp"
      - "192.168.68.62:3008:3000/tcp"

    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

    environment:
      TZ: Asia/Kolkata
      # OTEL ingetration
      OTEL_SERVICE_NAME: glasswing-homepage
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.68.62:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=homelab,host.name=pathfinder

    security_opt:
      - no-new-privileges:true

volumes:
  adguard_work:
    name: glasswing-adguard-work

  adguard_conf:
    name: glasswing-adguard-conf
