
name: glasswing-adguard

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: glasswing-adguard
    restart: unless-stopped

    ports:
      # DNS stays direct; an HTTP reverse proxy cannot carry it.
      - "192.168.68.62:53:53/tcp"
      - "192.168.68.62:53:53/udp"

    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-adguard

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: adguard

    networks:
      - proxy

volumes:
  adguard_work:
    name: glasswing-adguard-work

  adguard_conf:
    name: glasswing-adguard-conf

networks:
  proxy:
    name: glasswing-proxy
    external: true
