
name: glasswing-adguard

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: glasswing-adguard
    restart: unless-stopped

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:53:53/tcp"
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:53:53/udp"
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3007:80/tcp"
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3008:3000/tcp"

    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-adguard

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: adguard

    networks:
      - glasswing

volumes:
  adguard_work:
    name: glasswing-adguard-work

  adguard_conf:
    name: glasswing-adguard-conf

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
