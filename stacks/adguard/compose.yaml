
name: glasswing-adguard

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: glasswing-adguard
    restart: unless-stopped

    ports:
      - "192.168.68.62:53:53/tcp"
      - "192.168.68.62:53:53/udp"
      - "192.168.68.62:3007:80/tcp"
      - "192.168.68.62:3008:3000/tcp"

    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

    environment:
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-adguard

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: adguard

volumes:
  adguard_work:
    name: glasswing-adguard-work

  adguard_conf:
    name: glasswing-adguard-conf
