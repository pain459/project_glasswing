
name: glasswing-baserow

services:
  baserow:
    extends:
      file: ../base.yaml
      service: hardened
    image: baserow/baserow:2.4.1
    container_name: glasswing-baserow

    ports:
      - "${GLASSWING_HOST_IP:?required}:3032:80"

    environment:
      OTEL_SERVICE_NAME: glasswing-baserow
      BASEROW_PUBLIC_URL: http://192.168.68.62:3032

    volumes:
      - baserow_data:/baserow/data

    healthcheck:
      test:
        - CMD-SHELL
        - /baserow/backend/docker/docker-entrypoint.sh backend-healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    labels:
      com.glasswing.service: baserow

    networks:
      - glasswing

volumes:
  baserow_data:
    name: glasswing-baserow_data

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
