name: glasswing-serena

services:
  init-permissions:
    extends:
      file: ../base.yaml
      service: base
    image: alpine:3.20
    user: root
    environment:
      GLASSWING_HOST_IP: ${GLASSWING_HOST_IP:?Required}
    command:
      - sh
      - -c
      - |
        mkdir -p /config/memories/global
        if [ ! -f /config/serena_config.yml ]; then
          cp /bootstrap/serena_config.yml /config/serena_config.yml
        elif ! grep -q '^projects:' /config/serena_config.yml; then
          cp /config/serena_config.yml /config/serena_config.yml.pre-v2
          printf '\nprojects: []\n' >> /config/serena_config.yml
        fi
        # Ensure web_dashboard_trusted_hosts includes the LAN host IP.
        # Serena writes this key on startup with [127.0.0.1, localhost] by default.
        if ! grep -q "^- ${GLASSWING_HOST_IP}$" /config/serena_config.yml; then
          sed -i "/^web_dashboard_trusted_hosts:/a\\- ${GLASSWING_HOST_IP}" /config/serena_config.yml
        fi
        # Sync the projects registry from repos.env.
        # This replaces the projects: block in serena_config.yml with the
        # container paths from .projects.list, so adding a repo to repos.env
        # is all that is needed to register it with Serena.
        if [ -f /bootstrap/projects.list ]; then
          # Build a temp file with the new projects block
          tmpfile=$(mktemp)
          printf 'projects:\n' > "$tmpfile"
          while IFS= read -r ppath; do
            printf -- '- %s\n' "$ppath" >> "$tmpfile"
          done < /bootstrap/projects.list
          # Replace the existing projects block: everything from 'projects:'
          # through the consecutive '- ' lines that follow it.
          awk -v tmp="$tmpfile" '
            /^projects:/ { skip=1 }
            skip && /^- / { next }
            skip && !/^- / { skip=0; system("cat " tmp) }
            { print }
          ' /config/serena_config.yml > /config/serena_config.yml.tmp
          mv /config/serena_config.yml.tmp /config/serena_config.yml
          rm -f "$tmpfile"
        fi
        chown -R 1000:1000 /config
        chmod 600 /config/serena_config.yml
    volumes:
      - serena_config:/config
      - ./config/serena_config.yml:/bootstrap/serena_config.yml:ro
      - ./.projects.list:/bootstrap/projects.list:ro
    network_mode: none
    restart: "no"

  serena:
    extends:
      file: ../base.yaml
      service: hardened
    build:
      context: .
      dockerfile: Dockerfile
    image: glasswing/serena:2.1.1-node22
    container_name: glasswing-serena
    init: true

    depends_on:
      init-permissions:
        condition: service_completed_successfully

    user: "1000:1000"

    command:
      - serena
      - start-mcp-server
      - --transport
      - streamable-http
      - --port
      - "9121"
      - --host
      - 0.0.0.0

    ports:
      - "127.0.0.1:9121:9121"
      - "${GLASSWING_HOST_IP:?Required}:24282:24282"

    environment:
      SERENA_DOCKER: "1"
      TZ: ${GLASSWING_TZ:?Required from Infisical}
      OTEL_SERVICE_NAME: glasswing-serena

    volumes:
      # Repo mounts are generated by pre-up.sh from repos.env into
      # compose.override.yaml.  The config volume is always present.
      - serena_config:/workspaces/serena/config

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9121), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

    labels:
      com.glasswing.service: serena
      com.glasswing.category: ai
      com.glasswing.monitoring: "true"

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true

volumes:
  serena_config:
    name: glasswing-serena-config
