
name: glasswing-cyberchef

services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:11.5.0
    container_name: glasswing-cyberchef
    restart: unless-stopped

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-cyberchef

    ports:
      - "192.168.68.62:3013:8080"

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: cyberchef
