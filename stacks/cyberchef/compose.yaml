
name: glasswing-cyberchef

services:
  cyberchef:
    extends:
      file: ../base.yaml
      service: hardened
    image: ghcr.io/gchq/cyberchef:11.5.0
    container_name: glasswing-cyberchef

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-cyberchef

    ports:
      - "${GLASSWING_HOST_IP:?GLASSWING_HOST_IP is required}:3013:8080"

    labels:
      com.glasswing.service: cyberchef

    networks:
      - glasswing

networks:
  glasswing:
    name: ${GLASSWING_NETWORK:-glasswing}
    external: true
