
name: glasswing-cyberchef

services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:11.5.0
    container_name: glasswing-cyberchef
    restart: unless-stopped

    environment:
      # OTEL integration
      OTEL_SERVICE_NAME: glasswing-cyberchef

    security_opt:
      - no-new-privileges:true

    labels:
      com.glasswing.service: cyberchef

    networks:
      - proxy

networks:
  proxy:
    name: glasswing-proxy
    external: true
